# fritz-watchdog for TrueNAS SCALE ("Apps > Discover Apps > ... > Install via YAML") or plain Docker Compose.
# App name in TrueNAS: lowercase letters, digits and hyphens only (e.g. "fritz-watchdog").
# Replace /mnt/POOL/apps/fritz-watchdog with your folder. Change only the left (host) side of the volumes;
# inside the container the paths stay /app and /logs. The apps user (uid 568) needs read access to app/
# (plus traverse on the parent folders) and write access to logs/.
# Settings: see README.md. Start with DRY_RUN "1" and switch to "0" once the logs look right.

services:
  fritz-watchdog:
    image: python:3.13-alpine
    command: ["python", "-u", "/app/fritz_watchdog.py"]
    restart: unless-stopped
    user: "568:568"                      # TrueNAS "apps" user; needs read access to the app folder
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=1m"]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    volumes:
      - /mnt/POOL/apps/fritz-watchdog/app:/app:ro
      - /mnt/POOL/apps/fritz-watchdog/logs:/logs     # rotating log file; drop this line and LOG_DIR to disable
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      # Time zone as a POSIX TZ string (the alpine image ships no tz database). Central Europe:
      TZ: "CET-1CEST,M3.5.0,M10.5.0/3"
      # --- FRITZ!Box access (TR-064) ---
      FRITZ_HOST: "fritz.box"            # or the box's LAN IP
      FRITZ_USER: ""
      # Password: write "$" as "$$" and, inside '…', "'" as "''". Or leave it empty and put a line
      # FRITZ_PASSWORD=… into app/.env instead (no escaping there; see README.md).
      FRITZ_PASSWORD: ""
      FRITZ_TLS: "1"                    # HTTPS on the TR-064 security port (49443)
      # --- behaviour ---
      DRY_RUN: "1"                       # 1 = only log what would happen
      ON_CONNECTED: "reconnect"          # box says "Connected" but no internet: reconnect | none
      ON_DISCONNECTED: "reconnect"       # box not connected: reconnect | connect | none
      REBOOT_ENABLED: "0"                # 1 = reboot the box if reconnects do not help
      QUIET_WINDOWS: ""                  # e.g. "03:20-03:35" around the box's nightly forced reconnect
      LOG_DIR: "/logs"                   # rotating fritz-watchdog.log; "" = container log only
      # --- optional tuning (defaults shown) ---
      # CHECK_INTERVAL: "60"
      # FAIL_ROUNDS: "3"
      # PROBES: "tcp:1.1.1.1:443,tcp:9.9.9.9:443,tcp:8.8.8.8:53,http://connectivitycheck.gstatic.com/generate_204"
      # PROBE_TIMEOUT: "5"
      # PROBE_MIN_OK: "1"
      # WAN_SERVICE: "auto"
      # RECONNECT_SETTLE: "30"
      # RECOVERY_WAIT: "180"
      # RECONNECT_COOLDOWN: "600"
      # MAX_RECONNECTS_PER_DAY: "6"
      # REBOOT_AFTER_RECONNECTS: "2"
      # REBOOT_COOLDOWN: "3600"
      # MAX_REBOOTS_PER_DAY: "2"
      # REBOOT_WAIT: "300"
      # LOG_OK_EVERY: "60"
      # LOG_MAX_BYTES: "1000000"
      # LOG_BACKUPS: "5"
    healthcheck:
      test: ["CMD", "python", "/app/fritz_watchdog.py", "--health"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
